{{- if .Site.Params.logo }}
<a href="{{ .Site.BaseURL }}" class="logo" accesskey="h" title="Ced's Home Lab (Alt + H)">
  <img src="{{ .Site.Params.logo }}" alt="Ced's Home Lab" style="height: 36px; width: auto;">
</a>
{{- else }}
<a href="{{ .Site.BaseURL }}" accesskey="h" title="Ced's Home Lab (Alt + H)">
  {{- .Site.Title }}
</a>
{{- end }}
