<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ====================================================
   CED'S HOME LAB — HARDCODED THEME
   Injected into every page <head> after PaperMod CSS.
   ==================================================== */

/* ── VARS ── */
:root {
  --ced-teal:        #2dd4bf;
  --ced-teal-border: rgba(45, 212, 191, 0.35);
  --ced-teal-dim:    rgba(45, 212, 191, 0.08);
}

/* ── FONTS ── */
body {
  font-family: 'DM Sans', system-ui, sans-serif !important;
  font-weight: 300 !important;
}

/* ======================================================
   LIGHT MODE  (no [data-theme="dark"] on <html>)
   ====================================================== */
:root:not([data-theme="dark"]) {
  --theme:  #e5e8ed !important;
  --entry:  #d8dce3 !important;
  --border: rgba(45, 212, 191, 0.35) !important;
}

:root:not([data-theme="dark"]) body {
  background-color: #e5e8ed !important;
}

:root:not([data-theme="dark"]) .list {
  background-color: #e5e8ed !important;
}

:root:not([data-theme="dark"]) header,
:root:not([data-theme="dark"]) #site-header {
  background-color: #d0d4db !important;
  border-bottom: 1px solid #b8bcc6 !important;
}

:root:not([data-theme="dark"]) footer {
  background-color: #d0d4db !important;
  border-top: 1px solid #b8bcc6 !important;
  color: #4a5268 !important;
}

:root:not([data-theme="dark"]) .post-entry {
  background-color: #d8dce3 !important;
  border: 1px solid rgba(45, 212, 191, 0.35) !important;
}

:root:not([data-theme="dark"]) .post-entry .entry-header h2 {
  color: #1a1d26 !important;
}

:root:not([data-theme="dark"]) .post-entry .entry-content p {
  color: #2d3341 !important;
}

:root:not([data-theme="dark"]) .post-entry .entry-footer {
  color: #4a5268 !important;
}

:root:not([data-theme="dark"]) .post-entry .entry-cover,
:root:not([data-theme="dark"]) .post-entry .entry-cover a {
  background-color: #d8dce3 !important;
}

:root:not([data-theme="dark"]) .post-content p,
:root:not([data-theme="dark"]) .post-content li {
  color: #2d3341 !important;
}

:root:not([data-theme="dark"]) .post-content h2,
:root:not([data-theme="dark"]) .post-content h3 {
  color: #1a1d26 !important;
}

:root:not([data-theme="dark"]) .post-header h1 {
  color: #1a1d26 !important;
}

:root:not([data-theme="dark"]) .profile_inner p {
  color: #3a4155 !important;
}

:root:not([data-theme="dark"]) code {
  background: #c8ccd4 !important;
  border: 1px solid #b8bcc6 !important;
  color: #0d7a6e !important;
}

:root:not([data-theme="dark"]) table th {
  background: #c8ccd4 !important;
  color: #1a1d26 !important;
  padding: 0.65rem 1rem !important;
  font-family: 'DM Mono', monospace !important;
  font-size: 0.75rem !important;
  letter-spacing: 0.04em !important;
  text-transform: uppercase !important;
}

:root:not([data-theme="dark"]) table td {
  background: #d8dce3 !important;
  color: #2d3341 !important;
  padding: 0.6rem 1rem !important;
  border-top: 1px solid #c8ccd4 !important;
}

:root:not([data-theme="dark"]) table tr:nth-child(even) td {
  background: #cfd3da !important;
}

/* ======================================================
   DARK MODE  ([data-theme="dark"] on <html>)
   ====================================================== */
[data-theme="dark"] {
  --theme:  #0d0f14 !important;
  --entry:  #1a1d26 !important;
  --border: rgba(45, 212, 191, 0.35) !important;
}

[data-theme="dark"] body {
  background-color: #0d0f14 !important;
}

[data-theme="dark"] .list {
  background-color: #0d0f14 !important;
}

[data-theme="dark"] header,
[data-theme="dark"] #site-header {
  background-color: rgba(13, 15, 20, 0.95) !important;
  backdrop-filter: blur(8px) !important;
  border-bottom: 1px solid #1e2330 !important;
}

[data-theme="dark"] footer {
  background-color: #0d0f14 !important;
  border-top: 1px solid #1e2330 !important;
}

[data-theme="dark"] .post-entry {
  background-color: #1a1d26 !important;
  border: 1px solid rgba(45, 212, 191, 0.35) !important;
}

[data-theme="dark"] .post-entry .entry-header h2 {
  color: #eaeef5 !important;
}

[data-theme="dark"] .post-entry .entry-content p {
  color: #8a93a8 !important;
}

[data-theme="dark"] .post-entry .entry-footer {
  color: #4a5268 !important;
}

[data-theme="dark"] .post-entry .entry-cover,
[data-theme="dark"] .post-entry .entry-cover a {
  background-color: #1a1d26 !important;
}

/* ======================================================
   SHARED — both modes
   ====================================================== */

.post-entry {
  border-radius: 10px !important;
  padding: 1.5rem !important;
  margin-bottom: 1.25rem !important;
  position: relative !important;
  overflow: hidden !important;
  animation: cedFadeUp 0.5s ease forwards;
}

.post-entry::before {
  content: '' !important;
  position: absolute !important;
  left: 0 !important;
  top: 0 !important;
  bottom: 0 !important;
  width: 3px !important;
  background: #2dd4bf !important;
}

.post-entry .entry-header h2 {
  font-family: 'Playfair Display', Georgia, serif !important;
  font-size: 1.3rem !important;
  font-weight: 700 !important;
  line-height: 1.35 !important;
  margin-bottom: 0.5rem !important;
}

.post-entry .entry-footer {
  font-family: 'DM Mono', monospace !important;
  font-size: 0.7rem !important;
  letter-spacing: 0.06em !important;
  margin-top: 0.75rem !important;
}

.profile_inner h1,
.home-info .profile_inner h1 {
  font-family: 'Playfair Display', Georgia, serif !important;
  font-size: clamp(2.2rem, 5vw, 3.4rem) !important;
  font-weight: 900 !important;
  color: #2dd4bf !important;
}

.page-header h1 {
  font-family: 'Playfair Display', Georgia, serif !important;
  font-weight: 900 !important;
  color: #2dd4bf !important;
}

.post-content h2,
.post-content h3 {
  font-family: 'Playfair Display', Georgia, serif !important;
}

.logo a, .logo-text {
  font-family: 'DM Mono', monospace !important;
  letter-spacing: 0.06em !important;
}

/* ── ABOUT PAGE ── */
.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-bottom: 2.5rem;
}

@media (max-width: 640px) {
  .about-grid { grid-template-columns: 1fr; }
}

.about-stack-card {
  border-radius: 10px;
  padding: 1.5rem;
  border-left: 3px solid #2dd4bf;
}

:root:not([data-theme="dark"]) .about-stack-card {
  background: #d8dce3;
}

[data-theme="dark"] .about-stack-card {
  background: #1a1d26;
}

.about-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin: 1rem 0 2rem;
}

.about-link-btn {
  display: inline-block;
  padding: 0.5rem 1.1rem;
  border-radius: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.04em;
  text-decoration: none !important;
  border: 1px solid rgba(45, 212, 191, 0.4);
  color: #2dd4bf !important;
  transition: background 0.2s;
}

.about-link-btn:hover {
  background: rgba(45, 212, 191, 0.1);
}

.about-work-btn {
  display: inline-block;
  margin-top: 0.5rem;
  padding: 0.7rem 1.8rem;
  border-radius: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 0.9rem;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-decoration: none !important;
  background: #2dd4bf;
  color: #0d0f14 !important;
  transition: opacity 0.2s;
}

.about-work-btn:hover {
  opacity: 0.85;
}

/* ── SUBSCRIBE FORM INPUT ── */
input[type="email"],
input[type="text"] {
  color: #1a1d26 !important;
  background-color: #f5f7fa !important;
  border: 1px solid rgba(45, 212, 191, 0.4) !important;
  border-radius: 4px !important;
}

input[type="email"]::placeholder,
input[type="text"]::placeholder {
  color: #8a93a8 !important;
  opacity: 1 !important;
}

/* ── ANIMATIONS ── */
@keyframes cedFadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.post-entry:nth-child(1) { animation-delay: 0.05s; }
.post-entry:nth-child(2) { animation-delay: 0.12s; }
.post-entry:nth-child(3) { animation-delay: 0.19s; }
.post-entry:nth-child(4) { animation-delay: 0.26s; }
.post-entry:nth-child(5) { animation-delay: 0.33s; }
</style>
