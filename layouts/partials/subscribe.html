<!-- =============================================================
  SECTION: Newsletter Signup Form (The Lab Report)
  Submits to the self-hosted Listmonk mailing list server at
  newsletter.cedshomelab.com.

  FIELDS:
  - nonce (hidden): CSRF protection token, auto-filled by Listmonk
  - l (hidden): the Listmonk list UUID that new subscribers are
    added to — do not change this value
  - email: subscriber's email address (required)
  - name: subscriber's first name (optional, used for
    personalizing emails)

  The outer div uses the class "newsletter-signup" which is
  targeted by custom CSS for styling the box.
============================================================= -->
<div class="newsletter-signup">
  <!-- Heading and description shown above the form -->
  <h3>The Lab Report</h3>
  <p>Infrastructure engineering from the trenches, one homelab build at a time.</p>

  <!-- Listmonk subscription form -->
  <form method="post" action="http://newsletter.cedshomelab.com/subscription/form" class="listmonk-form">
    <!-- Hidden fields required by Listmonk — do not remove -->
    <input type="hidden" name="nonce">
    <input type="hidden" name="l" value="ee7ce558-2af5-4d36-aeb0-19d335b8b9a9">

    <!-- Visible form inputs -->
    <input type="email" name="email" placeholder="Your email address" required>
    <input type="text" name="name" placeholder="First name (optional)">

    <!-- Submit button -->
    <button type="submit">Join the Lab</button>
  </form>
</div>
<!-- End Newsletter Signup Form -->
